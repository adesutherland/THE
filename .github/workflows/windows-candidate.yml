name: Windows candidate qualification
on:
  push:
    branches: ['temp/shmuel-macros']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: adesutherland/DSL-Syntax-Highlighter
          ref: 383e5daab0ffcf6ec83e02db7a01a27709dabb2c
          path: .ci-deps/dslsh
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: adesutherland/CREXX
          ref: ae1607b8e145174422cee7f3e73fbcc37a65226c
          path: .ci-deps/crexx
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl
      - name: Install packaging and test tools
        shell: pwsh
        run: |
          choco install nsis ripgrep --no-progress -y
          "${{ steps.msys.outputs.msys2-location }}/ucrt64/bin" >> $env:GITHUB_PATH
          "THE_CI_UCRT=${{ steps.msys.outputs.msys2-location }}/ucrt64" >> $env:GITHUB_ENV
          "$env:ProgramFiles\CMake\bin" >> $env:GITHUB_PATH
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Fetch verified cREXX SDK and optional Regina
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'the-sdk'
          New-Item -ItemType Directory -Force $sdk | Out-Null
          function Fetch-Checked($url, $file, $hash) {
            curl.exe --fail --location --retry 3 --silent --show-error $url --output $file
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $hash) { throw "Hash mismatch: $file" }
          }
          Fetch-Checked 'https://github.com/adesutherland/CREXX/releases/download/v1.0.0-beta.3/CREXX-v1.0.0-beta.3-windows-x64-signed.zip' "$sdk/crexx.zip" 'bb83bda9545c7506592a1d1c71d1f1110b6da65b7431255afd64722aaebab539'
          Fetch-Checked 'https://downloads.sourceforge.net/project/regina-rexx/regina-rexx/3.9.6/Regina396w64.zip' "$sdk/regina.zip" '10641652e250e18106abbdd46a8f16b58076b3b1a235efbdc0778c0e5c809a89'
          Expand-Archive "$sdk/crexx.zip" "$sdk/crexx"
          Expand-Archive "$sdk/regina.zip" "$sdk/regina"
          New-Item -ItemType Directory "$sdk/include" | Out-Null
          Fetch-Checked 'https://raw.githubusercontent.com/adesutherland/CREXX/ae1607b8e145174422cee7f3e73fbcc37a65226c/interpreter/crexxsaa.h' "$sdk/include/crexxsaa.h" '500b61d094eca621fea8b8e6964cac75488539b8e73e3e520a72e72cae59f951'
          "THE_CI_SDK=$sdk" >> $env:GITHUB_ENV
      - name: Build parser-enabled compiler from the matching cREXX release source
        shell: pwsh
        run: |
          cmake -S .ci-deps/crexx -B build-parser -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DBUILD_TESTING=OFF `
            -DENABLE_LLAMA=OFF -DENABLE_PARSER_MODE=ON -DCREXX_FORCE_SYSTEM_OPENSSL=ON `
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON "-DOPENSSL_ROOT_DIR=$env:THE_CI_UCRT" `
            "-DDSLSH_LOCAL_DIR=$env:GITHUB_WORKSPACE/.ci-deps/dslsh"
          if ($LASTEXITCODE -ne 0) { throw 'Parser compiler configure failed' }
          cmake --build build-parser --target rxc --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Parser compiler build failed' }
          $crexx = "$env:THE_CI_SDK/crexx/CREXX-windows-x64"
          Copy-Item build-parser/bin/rxc.exe "$crexx/bin/rxc.exe" -Force
          foreach ($dll in @('libgcc_s_seh-1.dll','libwinpthread-1.dll','libstdc++-6.dll','libcrypto-3-x64.dll','libssl-3-x64.dll')) {
            Copy-Item "$env:THE_CI_UCRT/bin/$dll" "$crexx/bin/" -ErrorAction Stop
          }
          New-Item -ItemType Directory -Force "$crexx/licenses" | Out-Null
          Get-ChildItem "$env:THE_CI_UCRT/share/licenses" -Directory | Where-Object { $_.Name -match 'gcc|openssl|winpthread' } | Copy-Item -Destination "$crexx/licenses" -Recurse
      - name: Build bundled THE with both runtime bridges
        shell: pwsh
        run: |
          $crexx = "$env:THE_CI_SDK/crexx/CREXX-windows-x64"
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc `
            -DTHE_BUNDLE_CREXX=ON -DTHE_REXX_INTERPRETER=CREXX -DTHE_TEST_SHELL_TRACE=ON `
            "-DDSLSH_LOCAL_DIR=$env:GITHUB_WORKSPACE/.ci-deps/dslsh" `
            "-DCREXXSAA_INCLUDE_DIR=$env:THE_CI_SDK/include" "-DCREXXSAA_LIBRARY=$crexx/bin/crexxsaa.lib" `
            "-DCREXXSAA_RUNTIME_LIBRARY=$crexx/bin/crexxsaa.dll" "-DCREXX_LIBRARY_RXBIN=$crexx/bin/library.rxbin" `
            "-DCREXX_RXC_EXECUTABLE=$crexx/bin/rxc.exe" "-DCREXX_RXAS_EXECUTABLE=$crexx/bin/rxas.exe" `
            "-DCREXX_RXVM_EXECUTABLE=$crexx/bin/rxvm.exe" "-DCREXX_DRIVER_EXECUTABLE=$crexx/bin/crexx.exe" `
            "-DCREXX_LICENSE_FILE=$crexx/LICENSE" "-DREGINA_INCLUDE_DIR=$env:THE_CI_SDK/regina/include" `
            "-DREGINA_LIBRARY=$env:THE_CI_SDK/regina/regina.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build-release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Run editor and dual-engine regression tests
        shell: pwsh
        run: |
          ctest --test-dir build-release --output-on-failure --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Build archive and installer
        shell: pwsh
        run: |
          python scripts/package-release.py --build-dir build-release --version "4.0.0-ci.$env:GITHUB_RUN_NUMBER" --installer
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Test the installed release candidate
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem build-release/packages/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer' }
          ./scripts/test-windows-installer.ps1 -Installer $installer[0].FullName -ReginaLibrary "$env:THE_CI_SDK/regina/regina.dll"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate-and-test-results
          path: |
            build-release/packages/*
            build-release/Testing/Temporary/LastTest.log
            build-release/*test*/**/*.err
            build-release/*test*/**/*.out
          if-no-files-found: warn
